name: Tests und GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Server-Skripte prüfen
        run: |
          shellcheck -x deploy/server/*.sh
          bash deploy/server/test.sh

  # Spielserver: Tests mit echter PostgreSQL-Datenbank und Bau des Docker-Images
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leaqiz
          POSTGRES_PASSWORD: leaqiz
          POSTGRES_DB: leaqiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaqiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://leaqiz:leaqiz@localhost:5432/leaqiz_test
      - name: Docker-Image bauen
        working-directory: .
        run: docker build -f server/Dockerfile -t leaqizz:test .

  # Veröffentlicht den Ordner public/ über GitHub Pages dieses Repos – nur nach grünen Tests und nur von main.
  # Gilt, solange dieses Repo öffentlich ist (Variable SITE_REPO nicht gesetzt).
  # Voraussetzung (einmalig): Repo öffentlich, Settings → Pages → Source: "GitHub Actions".
  deploy:
    needs: [test, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_REPO == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Website mit Versionsnummer an CSS/JS; mit Variable PAGES_ZIEL nur die Weiterleitung (D-61)
      - name: Website oder Weiterleitung zusammenstellen
        env:
          PAGES_ZIEL: ${{ vars.PAGES_ZIEL }}
        run: SHA="${GITHUB_SHA::7}" bash deploy/site/zusammenstellen.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Branch „live“ = letzter Stand von main mit grünen Tests. Der Server folgt nur diesem Branch
  # (deploy/server/aktualisieren.sh, alle 10 Minuten). Geht nur vorwärts, nie auf einen älteren Stand.
  live:
    needs: [test, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: live auf diesen Stand setzen
        run: |
          if git fetch --quiet origin live 2>/dev/null && ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "live ist schon weiter als ${GITHUB_SHA::7}, bleibt."
            exit 0
          fi
          git push --quiet origin HEAD:refs/heads/live

  # Nach der Aufteilung (deploy/README.md, „Privates Code-Repo, öffentliches Seiten-Repo“):
  # Dieses Repo ist privat, die Website liegt im öffentlichen Repo aus der Variable SITE_REPO
  # und wird dort von GitHub Pages aus dem Branch main ausgeliefert. Hinüber geht nur public/,
  # dazu README und LICENSE – kein Servercode, keine Tests, keine Unterlagen.
  # Braucht das Secret SITE_TOKEN: fein granulierter Token nur für SITE_REPO, Recht „Contents: Read and write“.
  publish:
    needs: [test, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_REPO != ''
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Website oder Weiterleitung zusammenstellen
        env:
          PAGES_ZIEL: ${{ vars.PAGES_ZIEL }}
        run: SHA="${GITHUB_SHA::7}" bash deploy/site/zusammenstellen.sh _site
      - name: Ins öffentliche Repo schieben
        env:
          SITE_REPO: ${{ vars.SITE_REPO }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -z "$SITE_TOKEN" ]; then echo "::error::Secret SITE_TOKEN fehlt (deploy/README.md)"; exit 1; fi
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git" site
          # Alles außer .git ersetzen: gelöschte Dateien verschwinden auch drüben
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. site/
          cp deploy/site/README.md LICENSE site/
          # Ohne Jekyll ausliefern (Dateien genau so, wie sie sind)
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderung an der Website."; exit 0; fi
          git commit -q -m "Website aus ${GITHUB_SHA::7}"
          git push origin HEAD:main
