name: Tests und GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Spielserver: Tests mit echter PostgreSQL-Datenbank und Bau des Docker-Images
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leaqiz
          POSTGRES_PASSWORD: leaqiz
          POSTGRES_DB: leaqiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaqiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://leaqiz:leaqiz@localhost:5432/leaqiz_test
      - name: Docker-Image bauen
        working-directory: .
        run: docker build -f server/Dockerfile -t leaqizz:test .

  # Veröffentlicht den Ordner public/ – nur nach grünen Tests und nur von main.
  # Voraussetzung (einmalig): Repo öffentlich, Settings → Pages → Source: "GitHub Actions".
  deploy:
    needs: [test, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Versionsnummer an CSS/JS hängen, damit Browser nach jedem Deploy die neuen Dateien laden
      - name: Cache-Busting
        run: find public -name '*.html' -exec sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
