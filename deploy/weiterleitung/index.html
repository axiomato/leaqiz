<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Suchmaschinen dauerhaft gesperrt (Festlegung Nutzer: gilt für alle GitHub-Pages-Projekte) -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>leaqizz ist umgezogen</title>
    <!-- Weiterleitung nach dem Start (D-61): GitHub Pages zeigt nur noch diese Seite (auch als 404.html,
         also für jeden Pfad). __ZIEL__ ersetzt der Workflow durch die Variable PAGES_ZIEL. Ohne Skript greift
         das refresh auf die Startseite. -->
    <meta http-equiv="refresh" content="0; url=__ZIEL__/" />
    <script>
      (function () {
        // Pfad unter /leaqiz/ und Abfrage (z. B. ?pin=…) mitnehmen: /leaqiz/host/ → __ZIEL__/host/
        var path = location.pathname.replace(/^\/leaqiz(?=\/|$)/, '') || '/';
        location.replace('__ZIEL__' + path + location.search + location.hash);
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121826; color: #fff; font: 1.125rem/1.5 system-ui, sans-serif; text-align: center; padding: 1.5rem; }
      a { color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <p>leaqizz ist umgezogen: <a href="__ZIEL__/">__ZIEL__</a></p>
  </body>
</html>
