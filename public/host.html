<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>leaqiz – Spielleitung</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="host">
    <div id="app">
      <noscript><p>Bitte JavaScript aktivieren, um Spiele zu leiten.</p></noscript>
    </div>

    <dialog id="pw-dialog" class="dialog" aria-labelledby="pw-title">
      <form method="dialog" id="pw-form">
        <h2 id="pw-title">Host-Passwort</h2>
        <p class="hint">Dieser Server lässt nur berechtigte Personen Spiele starten.</p>
        <label class="field" for="pw-input"><span>Passwort</span></label>
        <input class="input" id="pw-input" type="password" autocomplete="current-password" required />
        <p class="error" id="pw-error" role="alert"></p>
        <div class="host-actions">
          <button class="btn btn--ghost" value="cancel" formnovalidate>Abbrechen</button>
          <button class="btn" value="ok">Spiel starten</button>
        </div>
      </form>
    </dialog>

    <div id="live" class="visually-hidden" aria-live="polite"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/socket.io/socket.io.min.js"></script>
    <script src="/js/vendor/qrcode.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/host.js"></script>
  </body>
</html>
